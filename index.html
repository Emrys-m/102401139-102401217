<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>校园失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- ========== 首页 ========== -->
  <div class="screen active" id="screen-home">
    <div class="home-header">
      <div class="home-title">校园失物招领</div>
      <div class="search-bar" onclick="go('search')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        搜索物品名称，如：校园卡、钥匙、雨伞…
      </div>
    </div>
    <div class="filter-tabs">
      <div class="filter-tab active" data-filter="all">全部</div>
      <div class="filter-tab" data-filter="lost">寻物启事</div>
      <div class="filter-tab" data-filter="found">招领信息</div>
    </div>
    <div class="info-list" id="home-list"></div>
  </div>

  <!-- ========== 发布页 ========== -->
  <div class="screen" id="screen-publish">
    <div class="nav-bar">
      <div class="nav-back" onclick="go('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
      </div>
      <div class="nav-title">发布信息</div>
    </div>
    <div class="type-switch">
      <div class="type-btn active-lost" id="type-lost" onclick="switchType('lost')">寻物启事</div>
      <div class="type-btn" id="type-found" onclick="switchType('found')">我要招领</div>
    </div>
    <div class="form-card">
      <div class="form-row">
        <div class="form-label">物品名称</div>
        <input class="form-input" id="f-name" placeholder="如：校园卡、钥匙、水杯">
      </div>
      <div class="form-row">
        <div class="form-label">物品图标</div>
        <div class="emoji-picker" id="emojiPicker"></div>
      </div>
      <div class="form-row" style="align-items:flex-start;">
        <div class="form-label" style="padding-top:8px;">物品描述</div>
        <textarea class="form-textarea" id="f-desc" placeholder="描述物品特征，如颜色、品牌、明显标记…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-label" id="f-place-label">丢失地点</div>
        <input class="form-input" id="f-place" placeholder="如：第一教学楼3楼">
      </div>
      <div class="form-row">
        <div class="form-label" id="f-time-label">丢失时间</div>
        <input class="form-input" id="f-time" placeholder="如：9月27日下午">
      </div>
      <div class="form-row">
        <div class="form-label">联系方式</div>
        <input class="form-input" id="f-contact" placeholder="微信号 / 手机号 / QQ">
      </div>
    </div>
    <button class="submit-btn" onclick="doPublish()">立即发布</button>
  </div>

  <!-- ========== 搜索页 ========== -->
  <div class="screen" id="screen-search">
    <div class="search-header">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-input" placeholder="输入物品关键词" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="search-cancel" onclick="go('home')">取消</div>
    </div>
    <div id="search-history">
      <div class="history-section">
        <div class="history-title"><span>热门搜索</span></div>
        <div class="history-tags">
          <div class="history-tag" onclick="quickSearch('校园卡')">校园卡</div>
          <div class="history-tag" onclick="quickSearch('雨伞')">雨伞</div>
          <div class="history-tag" onclick="quickSearch('耳机')">耳机</div>
          <div class="history-tag" onclick="quickSearch('钥匙')">钥匙</div>
          <div class="history-tag" onclick="quickSearch('水杯')">水杯</div>
        </div>
      </div>
    </div>
    <div id="search-result" style="display:none;">
      <div class="result-count" id="result-count"></div>
      <div class="info-list" id="search-list"></div>
    </div>
  </div>

  <!-- ========== 详情页 ========== -->
  <div class="screen" id="screen-detail">
    <div class="nav-bar">
      <div class="nav-back" onclick="backFromDetail()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
      </div>
      <div class="nav-title">信息详情</div>
    </div>
    <div class="detail-image" id="detail-image">💳</div>
    <div class="detail-body">
      <div class="detail-type-row">
        <span class="card-tag tag-lost" id="detail-tag">寻物启事</span>
        <span class="status-pill status-open" id="detail-status">寻物中</span>
      </div>
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-info-card">
        <div class="detail-row"><div class="label">物品描述</div><div class="value" id="detail-desc"></div></div>
        <div class="detail-row"><div class="label" id="detail-place-label">丢失地点</div><div class="value" id="detail-place"></div></div>
        <div class="detail-row"><div class="label">发布时间</div><div class="value" id="detail-time"></div></div>
      </div>
      <div class="contact-card">
        <div class="contact-info">
          <div class="label">发布者联系方式</div>
          <div class="value" id="detail-contact"></div>
        </div>
        <button class="contact-btn" onclick="copyContact()">复制</button>
      </div>
    </div>
    <div class="detail-bottom" id="detail-bottom">
      <button class="bottom-btn btn-outline" onclick="showToast('已复制联系方式，请尽快联系对方')">联系发布者</button>
    </div>
  </div>

  <!-- ========== 我的发布 ========== -->
  <div class="screen" id="screen-mine">
    <div class="profile-header">
      <div class="avatar">同</div>
      <div>
        <div class="profile-name">同学你好</div>
        <div class="profile-sub">校园失物招领 · 让丢失不再困难</div>
      </div>
    </div>
    <div class="my-stats">
      <div class="stat-item"><div class="stat-num" id="stat-published">0</div><div class="stat-label">已发布</div></div>
      <div class="stat-item"><div class="stat-num" id="stat-processing">0</div><div class="stat-label">进行中</div></div>
      <div class="stat-item"><div class="stat-num" id="stat-done">0</div><div class="stat-label">已解决</div></div>
    </div>
    <div class="my-list-title">我的发布</div>
    <div class="info-list" id="my-list" style="padding-top:0;"></div>
  </div>

  <!-- ========== 发布成功 ========== -->
  <div class="screen" id="screen-success">
    <div class="success-screen">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div class="success-title">发布成功</div>
      <div class="success-desc">您的信息已发布到校园失物招领平台<br>其他同学将在首页看到这条信息</div>
      <div class="success-actions">
        <button class="success-btn primary" onclick="go('home')">返回首页查看</button>
        <button class="success-btn ghost" onclick="go('mine')">查看我的发布</button>
      </div>
    </div>
  </div>

  <!-- 底部 tab -->
  <div class="tab-bar" id="tabbar">
    <div class="tab-item active" data-tab="home" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      首页
    </div>
    <div class="tab-item" onclick="go('publish')">
      <div class="publish-fab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>
    <div class="tab-item" data-tab="mine" onclick="go('mine')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      我的
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
